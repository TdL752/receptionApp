<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='utf-8'>
		<meta name='viewport' content='width=device-width initial-scale=1.0'>
		<link rel='stylesheet' href='styles.css'>
	</head>
	<body>

		<nav id="nav">
			<img id="logo" alt="logo" src="https://res.cloudinary.com/dbuwekmex/image/upload/v1776180436/20220619164729_IMG_0369_ehdycb.jpg" />
			<div id="nav-link-container">
				<a class="nav-link" href="/profile">
					Profile
				</a>
				<a class="nav-link" href="/home">
					Home
				</a>
				<input id="search-input" type="text" placeholder="Search" maxlength="30" />
				<button id="search-btn">
					>
				</button>
			</div>
		</nav>

		<div id="user-container" class="container">

			<img id="profile-image" alt="profile image" />

			<h1 class="header">
				Account Info
			</h1>
			<hr>

			<label for="username">
				Username: 
			</label>
			<p id="username" class="container-text"></p>

			<label for="account-create">
				Account Created: 
			</label>
			<p id="account-create" class="container-text"></p>

			<label for="last-login">
				Last Login: 
			</label>
			<p id="last-login" class="container-text"></p>

			<label for="subscription">
				Subscription Status: 
			</label>
			<p id="subscription" class="container-text"></p>


			<h1 class="header">
				Personal Info
			</h1>
			<hr>

			<label for="name">
				Name: 
			</label>
			<p id="name" class="container-text"></p>

			<label for="gender">
				Gender: 
			</label>
			<p id="gender" class="container-text"></p>

			<label for="age">
				Age: 
			</label>
			<p id="age" class="container-text"></p>

			<label for="date">
				Date of Birth: 
			</label>
			<p id="date" class="container-text"></p>

			
			<h1 class="header">
				Contact Info
			</h1>
			<hr>

			<label for="phone">
				Phone Number: 
			</label>
			<p id="phone" class="container-text"></p>

			<label for="email">
				Email: 
			</label>
			<p id="email" class="container-text"></p>

			<label for="city">
				City: 
			</label>
			<p id="city" class="container-text"></p>

			<label for="state">
				State: 
			</label>
			<p id="state" class="container-text"></p>

			<label for="country">
				Country: 
			</label>
			<p id="country" class="container-text"></p>

			<label for="zip">
				Zip Code: 
			</label>
			<p id="zip" class="container-text"></p>


			<h1 class="header">
				Work Info
			</h1>
			<hr>

			<label for="occupation">
				Occupation: 
			</label>
			<p id="occupation" class="container-text"></p>

			<label for="company">
				Company: 
			</label>
			<p id="company" class="container-text"></p>


			<h1 class="header">
				Socials
			</h1>
			<hr>

			<label for="twitter">
				Twitter: 
			</label>
			<p id="twitter" class="container-text"></p>

			<label for="linkedin">
				LinkedIn: 
			</label>
			<p id="linkedin" class="container-text"></p>

			<label for="github">
				Github: 
			</label>
			<p id="github" class="container-text"></p>
		</div>
		
		<div id="no-user" class="container">
			<h1 class="prompt">
				Could not find a user with that name or username.
			</h1>
		</div>

		<script src="script.js"></script>
	</body>
</html>
